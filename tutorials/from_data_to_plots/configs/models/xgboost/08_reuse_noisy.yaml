# Run 03_noisy_tuned first. Load that fixed full-cohort model; do not refit.
project: tutorial_06_external_noisy_tuned
data_input: ../../../data/noisy/peptides.csv
metadata_input: ../../../data/noisy/metadata.csv
data_input_mode: matrix
lib_metadata_input: ../../../data/peptide_library.csv
lib_col_peptide_name: peptide_id
col_sample_name: SampleName
col_target: group_test
group_tests:
- Control
- Case
transposed: false
peptide_prefixes:
- agilent_
- twist_
- corona2_
extra_features_to_include:
- Sex
- Smoking
- Age
- BMI
fillna_value: null
filters_metadata: null
combined_filters_metadata: null
random_state: 420
classification:
  model_type: xgboost
  param_grid_name: xgboost
  seed: 420
  run_nested_cv: false
  use_pretrained: true
  only_train_model: false
  with_oligos: true
  with_additional_features: true
  subgroup: all
  oligo_filters: null
  oligo_filter_mode: all
  prevalence_threshold_min: 0
  prevalence_threshold_max: 100
  outer_cv_splits: 3
  inner_cv_splits: 2
  n_iter: 12
  n_jobs_outer: 1
  n_jobs_inner: 1
  impute_extra_numeric: false
  extra_numeric_impute_strategy: median
  fill_missing_peptides_with_zero: false
  classification_threshold: 0.5
  bootstrap_validation: true
  bootstrap_n_resamples: 500
  bootstrap_confidence_level: 0.95
  train_filters:
    cohort: training
  split_filters: null
  split_only: false
  validation_sets:
  - name: 08_reuse_noisy
    filters:
      cohort: external
  output_dir: ../../../results/xgboost/08_reuse_noisy
  output_name: 06_external_noisy_tuned
  input_dir: ../../../results/xgboost/03_noisy_tuned
  input_name: training_xgboost_03_noisy_tuned_420.joblib
param_grid: {}
