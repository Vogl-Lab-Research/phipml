# phipml 4.2.0 tutorial. Paths are relative to this YAML.
# See docs/MODEL_CONFIG.md and docs/HYPERPARAMETERS.md for every setting.
project: tutorial_03_noisy_tuned
data_input: ../../../data/noisy/peptides.csv
metadata_input: ../../../data/noisy/metadata.csv
data_input_mode: matrix
lib_metadata_input: ../../../data/peptide_library.csv
lib_col_peptide_name: peptide_id
col_sample_name: SampleName
col_target: group_test
group_tests:
- Control
- Case
transposed: false
peptide_prefixes:
- agilent_
- twist_
- corona2_
extra_features_to_include:
- Sex
- Smoking
- Age
- BMI
fillna_value: null
filters_metadata: null
combined_filters_metadata: null
random_state: 420
classification:
  model_type: xgboost
  param_grid_name: xgboost
  seed: 420
  run_nested_cv: true
  use_pretrained: false
  only_train_model: true
  with_oligos: true
  with_additional_features: true
  subgroup: all
  oligo_filters: null
  oligo_filter_mode: all
  prevalence_threshold_min: 0
  prevalence_threshold_max: 100
  outer_cv_splits: 3
  inner_cv_splits: 2
  n_iter: 12
  n_jobs_outer: 1
  n_jobs_inner: 1
  impute_extra_numeric: false
  extra_numeric_impute_strategy: median
  fill_missing_peptides_with_zero: false
  classification_threshold: 0.5
  bootstrap_validation: true
  bootstrap_n_resamples: 500
  bootstrap_confidence_level: 0.95
  train_filters:
    cohort: training
  split_filters: null
  split_only: false
  validation_sets: []
  output_dir: ../../../results/xgboost/03_noisy_tuned
  output_name: 03_noisy_tuned
param_grid:
  xgboost:
    preprocessor__peptides__feature_selection__estimator__l1_ratio:
      type: real
      low: 0.2
      high: 0.8
    preprocessor__peptides__feature_selection__estimator__C:
      type: real
      low: 0.1
      high: 10.0
      prior: log-uniform
    estimator__n_estimators:
      type: integer
      low: 50
      high: 160
    estimator__learning_rate:
      type: real
      low: 0.02
      high: 0.25
      prior: log-uniform
    estimator__max_depth:
      type: integer
      low: 2
      high: 5
    estimator__min_child_weight:
      type: integer
      low: 1
      high: 8
    estimator__subsample:
      type: real
      low: 0.65
      high: 1.0
    estimator__colsample_bytree:
      type: real
      low: 0.65
      high: 1.0
    estimator__reg_lambda:
      type: real
      low: 0.1
      high: 10.0
      prior: log-uniform
    estimator__reg_alpha:
      type: real
      low: 0.0001
      high: 1.0
      prior: log-uniform
    estimator__gamma:
      type: real
      low: 0.0
      high: 2.0
