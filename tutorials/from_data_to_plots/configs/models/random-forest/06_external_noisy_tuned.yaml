# phipml 4.2.0 tutorial. Paths are relative to this YAML.
# See docs/MODEL_CONFIG.md and docs/HYPERPARAMETERS.md for every setting.
project: tutorial_06_external_noisy_tuned
data_input: ../../../data/noisy/peptides.csv
metadata_input: ../../../data/noisy/metadata.csv
data_input_mode: matrix
lib_metadata_input: ../../../data/peptide_library.csv
lib_col_peptide_name: peptide_id
col_sample_name: SampleName
col_target: group_test
group_tests:
- Control
- Case
transposed: false
peptide_prefixes:
- agilent_
- twist_
- corona2_
extra_features_to_include:
- Sex
- Smoking
- Age
- BMI
fillna_value: null
filters_metadata: null
combined_filters_metadata: null
random_state: 420
classification:
  model_type: random-forest
  param_grid_name: random-forest
  seed: 420
  run_nested_cv: false
  use_pretrained: false
  only_train_model: false
  with_oligos: true
  with_additional_features: true
  subgroup: all
  oligo_filters: null
  oligo_filter_mode: all
  prevalence_threshold_min: 0
  prevalence_threshold_max: 100
  outer_cv_splits: 3
  inner_cv_splits: 2
  n_iter: 12
  n_jobs_outer: 1
  n_jobs_inner: 1
  impute_extra_numeric: false
  extra_numeric_impute_strategy: median
  fill_missing_peptides_with_zero: false
  classification_threshold: 0.5
  bootstrap_validation: true
  bootstrap_n_resamples: 500
  bootstrap_confidence_level: 0.95
  train_filters:
    cohort: training
  split_filters: null
  split_only: false
  validation_sets:
  - name: 06_external_noisy_tuned
    filters:
      cohort: external
  output_dir: ../../../results/random-forest/06_external_noisy_tuned
  output_name: 06_external_noisy_tuned
param_grid:
  random-forest:
    preprocessor__peptides__feature_selection__estimator__l1_ratio:
      type: real
      low: 0.2
      high: 0.8
    preprocessor__peptides__feature_selection__estimator__C:
      type: real
      low: 0.1
      high: 10.0
      prior: log-uniform
    estimator__n_estimators:
      type: integer
      low: 60
      high: 160
    estimator__max_depth:
      type: integer
      low: 2
      high: 10
    estimator__min_samples_split:
      type: integer
      low: 2
      high: 10
    estimator__min_samples_leaf:
      type: integer
      low: 1
      high: 6
    estimator__max_features:
      type: categorical
      categories:
      - sqrt
      - log2
      - 0.5
    estimator__class_weight:
      type: categorical
      categories:
      - null
      - balanced
